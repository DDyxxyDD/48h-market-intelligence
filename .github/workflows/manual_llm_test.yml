name: Manual Phase 5 LLM and Email Validation

on:
  workflow_dispatch:
    inputs:
      openai_model:
        description: OpenAI model to use for Phase 4 validation
        required: false
        default: gpt-5.4-mini
        type: string
      send_email:
        description: "Send the generated briefing by email"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-phase-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest

      - name: Run live Phase 4 LLM pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || 'gpt-5.4-mini' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py --live --llm ${{ inputs.send_email && '--send-email' || '' }}

      - name: Upload Phase 4 outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-briefing-test
          if-no-files-found: warn
          path: |
            data/output/llm_briefing.html
            data/output/llm_editorial.json
            data/output/llm_analysis.json
            data/output/candidates.json
            data/output/live_briefing.html
            data/output/strategy_case.json
            data/output/email_delivery.json
