name: Manual Phase 5 LLM and Email Validation

on:
  workflow_dispatch:
    inputs:
      openai_model:
        description: OpenAI model to use for Phase 4 validation
        required: false
        default: gpt-5.4-mini
        type: string
      recipients:
        description: "Recipient email(s), comma-separated; blank = saved default"
        required: false
        type: string
      delivery_mode:
        description: "What should be sent?"
        required: true
        type: choice
        options:
          - generate_and_send
          - send_existing_briefing
        default: generate_and_send
      strategy_region:
        description: "Corporate Strategy region"
        required: true
        type: choice
        options:
          - auto
          - china
          - non_china
        default: auto

permissions:
  contents: read

jobs:
  validate-phase-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest

      - name: Generate and send a new briefing
        if: ${{ inputs.delivery_mode == 'generate_and_send' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || 'gpt-5.4-mini' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
          RECIPIENTS: ${{ inputs.recipients }}
          STRATEGY_REGION: ${{ inputs.strategy_region }}
        run: |
          args=(--live --llm --send-email --email-to "$RECIPIENTS")
          if [[ "$STRATEGY_REGION" != "auto" ]]; then
            args+=(--strategy-region "$STRATEGY_REGION")
          fi
          python main.py "${args[@]}"

      - name: Send the existing briefing
        if: ${{ inputs.delivery_mode == 'send_existing_briefing' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.EMAIL_TO }}
          RECIPIENTS: ${{ inputs.recipients }}
        run: python main.py --email-existing-briefing --email-to "$RECIPIENTS"

      - name: Upload Phase 4 outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: llm-briefing-test
          if-no-files-found: warn
          path: |
            data/output/llm_briefing.html
            data/output/llm_editorial.json
            data/output/llm_analysis.json
            data/output/candidates.json
            data/output/live_briefing.html
            data/output/strategy_case.json
            data/output/email_delivery.json
